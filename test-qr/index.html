<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>테스트 승선 QR</title>
<style>body{margin:0;padding:16px;font-family:"Malgun Gothic",sans-serif;background:#EEF2F5;color:#0E1A24}
h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

<h1>테스트 승선 QR 5장</h1><p>가짜 인물입니다. 선장 앱의 "QR 이미지 불러오기"로 PNG를 고르거나, 이 화면을 카메라로 찍어 시험하세요.</p>
<div class="grid"><figure><img src="1_solo_kimbada.png" alt="김바다 테스트 QR"><figcaption><b>김바다</b>혼자 · 보통 성인<br>1_solo_kimbada.png</figcaption></figure><figure><img src="2_solo_parkhaesun.png" alt="박해순 테스트 QR"><figcaption><b>박해순</b>혼자 · QR 만든 지 1년 넘음(경고 확인용)<br>2_solo_parkhaesun.png</figcaption></figure><figure><img src="3_solo_choiminjun.png" alt="최민준 테스트 QR"><figcaption><b>최민준</b>혼자 · 12세(보호자 없는 14세 미만 경고 확인용)<br>3_solo_choiminjun.png</figcaption></figure><figure><img src="4_group1of2_ohsangcheol.png" alt="오상철 테스트 QR"><figcaption><b>오상철</b>일행 1/2 · 대표(보호자)<br>4_group1of2_ohsangcheol.png</figcaption></figure><figure><img src="5_group2of2_ohjimin.png" alt="오지민 테스트 QR"><figcaption><b>오지민</b>일행 2/2 · 11세 자녀(보호자 동행)<br>5_group2of2_ohjimin.png</figcaption></figure></div>
</body></html>
