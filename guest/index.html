<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>승선 QR</title>
  <meta name="description" content="낚시배 탈 때 보여 주는 내 승선 QR">
  <meta name="theme-color" content="#0B3A5B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="confirm" class="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" value="cancel">취소</button>
        <button class="btn btn-danger" value="ok" id="confirm-ok">지우기</button>
      </div>
    </form>
  </dialog>

  <noscript>이 화면은 자바스크립트가 켜져 있어야 동작합니다.</noscript>
  <script src="../vendor/lz-string.min.js"></script>
  <script src="../vendor/qrcode.js"></script>
  <script src="../shared/bmqr.js"></script>
  <script src="../shared/person-form.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
