<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>승선명부</title>
  <meta name="description" content="손님 승선 QR을 찍어 오늘 항차 승선자명부를 만듭니다">
  <meta name="theme-color" content="#C2410C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="confirm" class="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" value="cancel">취소</button>
        <button class="btn btn-danger" value="ok" id="confirm-ok">확인</button>
      </div>
    </form>
  </dialog>

  <dialog id="pin-dialog" class="confirm">
    <form method="dialog">
      <h2 id="pin-dialog-title">PIN</h2>
      <p>설정에서 정한 PIN을 넣어 주세요.</p>
      <input id="pin-dialog-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" class="pin-input pin-dialog-input">
      <p class="err" id="pin-dialog-err"></p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" value="cancel">취소</button>
        <button class="btn btn-primary" value="ok">확인</button>
      </div>
    </form>
  </dialog>

  <noscript>이 화면은 자바스크립트가 켜져 있어야 동작합니다.</noscript>
  <script src="../vendor/lz-string.min.js"></script>
  <script src="../vendor/pdf-lib.min.js"></script>
  <script src="../vendor/fontkit.umd.min.js"></script>
  <script src="../shared/bmqr.js"></script>
  <script src="../shared/person-form.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="db.js"></script>
  <script src="scanner.js"></script>
  <script src="rules.js"></script>
  <script src="xlsx.js"></script>
  <script src="font-subset.js"></script>
  <script src="export.js"></script>
  <script src="app.js"></script>
</body>
</html>
